services:
  motionai:
    build: .
    ports:
      - "127.0.0.1:3000:8000"
    environment:
      MOTIONAI_ENV: ${MOTIONAI_ENV:-local}
      MOTIONAI_PUBLIC_URL: ${MOTIONAI_PUBLIC_URL:-http://localhost:3000}
      MOTIONAI_REQUIRE_MODEL: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - motionai_data:/var/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
volumes:
  motionai_data:
